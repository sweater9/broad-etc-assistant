name: Refresh ETF market cache

on:
  workflow_dispatch:
  schedule:
    - cron: '35 18 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/update-market-data.mjs'
      - '.github/workflows/market-data.yml'

permissions:
  contents: write

concurrency:
  group: market-data-cache
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build validated market cache
        id: market
        continue-on-error: true
        run: node scripts/update-market-data.mjs
      - name: Commit cache and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-history.json data/market-update-status.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No market-data changes to commit"
          else
            git commit -m "Refresh validated ETF market cache diagnostics"
            git pull --rebase origin main
            git push
          fi
      - name: Enforce successful refresh
        if: steps.market.outcome != 'success'
        run: |
          echo "Market cache refresh failed. See data/market-update-status.json for diagnostics."
          exit 1
